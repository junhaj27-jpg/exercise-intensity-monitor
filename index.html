<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://ai2a.appinventor.mit.edu/?locale=ko_KR#7773550">
    <title>Exercise Intensity Monitor</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f4f7f8;
        color: #172124;
      }

      main {
        width: min(92vw, 520px);
        padding: 32px;
        border: 1px solid #d8e2e5;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 14px 36px rgba(23, 33, 36, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        line-height: 1.6;
      }

      a {
        color: #006b70;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111719;
          color: #edf4f5;
        }

        main {
          border-color: #334247;
          background: #182225;
          box-shadow: none;
        }

        a {
          color: #65d9df;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Exercise Intensity Monitor</h1>
      <p>Opening the MIT App Inventor project page.</p>
      <p>
        If the page does not open automatically,
        <a href="https://ai2a.appinventor.mit.edu/?locale=ko_KR#7773550">open the project page</a>.
      </p>
    </main>
  </body>
</html>
